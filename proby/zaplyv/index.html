<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Заплыв · проба</title>
<style>
html, body { margin: 0; height: 100%; background: #02040a; overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, system-ui, sans-serif; color: #fff; }
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
#hud { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 68px; right: 68px; font-size: 17px;
  opacity: 0.75; pointer-events: none; display: flex; justify-content: space-between; }
#scalebox { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom) + 8px); font-size: 12px; opacity: 0.45; pointer-events: none; }
#scale { height: 3px; background: #fff; margin-bottom: 3px; border-radius: 2px; }
#ver { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 6px); font-size: 11px; opacity: 0.3; pointer-events: none; }
.layer { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; background: rgba(2, 4, 10, 0.72); padding: 24px; } /* без размытия под слоем: в WebKit без видеокарты оно дорогое */
.layer.on { display: flex; }
#genes { justify-content: flex-start; padding-top: calc(env(safe-area-inset-top) + 70px); background: linear-gradient(rgba(2, 4, 10, 0.7), transparent 30%, transparent 62%, rgba(2, 4, 10, 0.75)); backdrop-filter: none; -webkit-backdrop-filter: none; }
#cards { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 28px); display: flex; gap: 12px; }
#cards button { width: auto; flex: 1; font-size: 19px; }
.gicon { display: block; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #7cc8ff; margin: 0 auto 6px; object-fit: cover; } /* значок гена: снимок клетки, ген подсвечен */
#gcard .gicon.big { float: left; width: 64px; height: 64px; margin: 2px 12px 4px 0; }
.ticon { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #7cc8ff; margin-right: 10px; }
#genes .kid { position: absolute; top: 24%; bottom: 30%; width: 46%; background: transparent; border: none; } /* касание самой дочки */
.layer h1 { margin: 0 0 8px; font-size: 32px; font-weight: 600; }
.layer p { margin: 0 0 12px; font-size: 18px; opacity: 0.8; text-align: center; line-height: 1.5; }
#end { justify-content: flex-start; overflow-y: auto; padding: calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 24px); gap: 10px; }
#night { justify-content: flex-start; gap: 8px; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); background: #04121a; }
#nhead { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; } #nhead b { font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#nhead button { flex: 0 0 auto; width: auto; min-width: 48px; min-height: 44px; padding: 0 14px; } #ndanger[hidden] { display: none; }
#end #nightgo { min-height: 56px; } #end #again { min-height: 44px; font-size: 17px; } /* главная на экране одна — «Ночь рода» */
#night #nask { margin: 0; font-size: 17px; } #night #nnote { margin: 0; font-size: 13px; opacity: 0.65; }
#ndanger { display: flex; gap: 10px; width: 100%; } #ndanger button { flex: 1; width: auto; min-height: 56px; font-size: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; }
#ndanger img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #ff8a6a; } #ndanger [data-d=phage] img { border-color: #e8f2ff; } #ndanger [data-d=hunger] img { border-color: #f5e17a; filter: brightness(0.55) saturate(0.6); }
#nbox { flex: 1; min-height: 0; width: 100%; position: relative; } #ncv { position: absolute; inset: 0; width: 100%; height: 100%; }
#npicks { display: flex; flex-direction: column; gap: 8px; width: 100%; }
#npicks button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; text-align: left; font-size: 15px; padding: 8px 12px; border: 2px solid transparent; }
#npicks button.on { border-color: #9fe6ff; } #npicks i { flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; } #npicks small { display: block; opacity: 0.7; font-size: 13px; }
#ngo { width: 100%; flex-shrink: 0; min-height: 52px; } #ngo:disabled { opacity: 0.45; }
#ebtns { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; } /* кнопки одним столбиком: каждая на своём месте, не друг на друге (урок L017) */
#end button { flex-shrink: 0; background: rgba(10, 60, 50, 0.92); }
#card, #path { width: min(380px, 100%); box-sizing: border-box; border-radius: 20px; padding: 12px 16px; }
#card { background: rgba(255, 90, 60, 0.1); border: 1px solid rgba(255, 140, 100, 0.35); }
#path { background: rgba(80, 200, 255, 0.07); border: 1px solid rgba(120, 220, 255, 0.25); }
#who { font-size: 15px; opacity: 0.75; }
#card h2 { margin: 2px 0 6px; font-size: 23px; font-weight: 600; }
#path h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; opacity: 0.8; }
#card p, #path p { margin: 0 0 6px; font-size: 15px; line-height: 1.35; text-align: left; opacity: 0.85; }
#cfact::before { content: "Удивительно: "; font-weight: 600; }
#ctip { color: #9ff5d8; }
/* Альманах (макет design/zaplyv_almanah_maket.png): полка с разделами и страница по касанию */
#cabinet { z-index: 30; background: radial-gradient(120% 80% at 50% 0%, #0a2832, #02040a 60%); justify-content: flex-start; align-items: stretch; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 20px); gap: 0; }
#cabinet > div { width: min(420px, 100%); margin: 0 auto; }
.khead { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
.khead h1 { margin: 0; font-size: 26px; font-weight: 700; }
button.round { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; flex-shrink: 0; font-size: 22px; background: rgba(2, 4, 10, 0.4); border-color: rgba(255, 255, 255, 0.25); }
#kcount { margin: 4px 0 8px; font-size: 16px; opacity: 0.8; text-align: left; }
#kbar { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); margin-bottom: 14px; }
#kbar i { display: block; height: 100%; border-radius: 2px; background: #3ee0a8; }
#kpills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; } /* все разделы видны сразу, без прокрутки и обрезанных слов */
#kpills button { width: auto; min-height: 44px; height: 44px; flex-shrink: 0; padding: 0 14px; border-radius: 22px; font-size: 16px; background: transparent; border-color: rgba(255, 255, 255, 0.25); color: rgba(255, 255, 255, 0.8); }
#kpills button.on { border-color: #3ee0a8; background: rgba(62, 224, 168, 0.14); color: #fff; }
#shelf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kc { position: relative; width: auto; min-height: 0; padding: 8px 8px 12px; border-radius: 20px; text-align: left; font-size: 16px; display: flex; flex-direction: column; gap: 4px;
  background: rgba(255, 255, 255, 0.04); border: 1px solid var(--g, rgba(255, 255, 255, 0.25)); }
.kc img, .kc .ph { width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; object-fit: cover; background: #061018; display: block; }
.kc b { font-size: 16px; font-weight: 700; padding: 2px 4px 0; line-height: 1.2; }
.kc span { font-size: 12.5px; line-height: 1.3; opacity: 0.72; padding: 0 4px; }
.kc:active { background: rgba(255, 255, 255, 0.12); }
.kc.no { border-style: dashed; border-color: rgba(255, 255, 255, 0.2); }
.kc.no img { filter: grayscale(1) blur(3px) brightness(0.55); }
.kc.no b { opacity: 0.6; }
.kc .new { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; border-radius: 50%; background: #3ee0a8; }
#kcard[hidden], #kshelf[hidden] { display: none; }
#kframe { position: relative; border-radius: 20px; overflow: hidden; border: 1px solid var(--g); background: #061018; }
#kframe img { display: block; width: 100%; height: 200px; object-fit: cover; }
#ksize { position: absolute; left: 12px; bottom: 8px; font-size: 13px; opacity: 0.85; text-shadow: 0 1px 3px #000; }
#kname { margin: 14px 0 2px; font-size: 28px; font-weight: 700; }
#ktag { color: var(--g); font-size: 16px; margin-bottom: 12px; }
.kb { border-radius: 18px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); }
.kb h3 { margin: 0 0 6px; font-size: 12.5px; letter-spacing: 2px; font-weight: 600; opacity: 0.75; }
.kb p { margin: 0 0 6px; font-size: 16px; line-height: 1.4; text-align: left; opacity: 0.92; }
.kb small { display: block; font-size: 12.5px; opacity: 0.55; }
#knav { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0 10px; }
#knav button { width: auto; min-height: 44px; padding: 0 6px; background: transparent; border: none; font-size: 16px; color: rgba(255, 255, 255, 0.7); }
#kswim { width: 100%; min-height: 56px; }
button.ghost { background: transparent; min-height: 52px; font-size: 18px; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 44px); transform: translate(-50%, -10px); padding: 8px 16px; border-radius: 16px;
  background: rgba(120, 220, 255, 0.16); border: 1px solid rgba(120, 220, 255, 0.4); font-size: 15px; width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; display: flex; align-items: center; /* длинная подпись переносится, а не уходит за край */
  opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
#toast.on { opacity: 0.95; transform: translate(-50%, 0); }
button { width: min(340px, 86vw); min-height: 64px; border-radius: 22px; border: 1px solid rgba(120, 255, 210, 0.45);
  background: rgba(60, 255, 200, 0.12); color: #fff; font: inherit; font-size: 21px; padding: 10px 16px; }
button small { display: block; font-size: 15px; opacity: 0.7; margin-top: 3px; }
button:active { background: rgba(60, 255, 200, 0.3); }
/* Пауза с геномом (макет design/zaplyv_genom_maket.png) */
#pause { position: fixed; z-index: 20; left: 10px; top: calc(env(safe-area-inset-top) + 8px); width: 48px; min-height: 48px; height: 48px; padding: 0; border-radius: 50%;
  background: rgba(2, 4, 10, 0.35); border: 1px solid rgba(120, 255, 210, 0.35); display: flex; align-items: center; justify-content: center; gap: 5px; }
#flag { position: fixed; z-index: 20; right: 10px; top: calc(env(safe-area-inset-top) + 8px); width: 48px; min-height: 48px; height: 48px; padding: 0; border-radius: 50%;
  background: rgba(2, 4, 10, 0.35); border: 1px solid rgba(255, 170, 120, 0.45); color: #ffb48a; font-size: 20px; }
button.flag { border-color: rgba(255, 170, 120, 0.55); color: #ffc9a8; background: transparent; }
#gchips button { white-space: nowrap; width: auto; min-height: 44px; font-size: 14px; padding: 5px 14px; border-radius: 22px; /* палец: не меньше 44 pt (урок L017) */ }
#grow { display: flex; gap: 10px; width: 100%; max-width: 420px; flex-shrink: 0; z-index: 1; }
#grow button { flex: 1; width: auto; min-height: 46px; font-size: 17px; }
body.paused #flag { visibility: hidden; }
button { touch-action: manipulation; } /* касание — сразу нажатие, без ожидания двойного касания */
#note { position: fixed; z-index: 60; right: 10px; top: calc(env(safe-area-inset-top) + 62px); max-width: 80vw; padding: 8px 14px; border-radius: 16px;
  background: rgba(60, 20, 10, 0.92); border: 1px solid rgba(255, 170, 120, 0.7); color: #ffd9c4; font-size: 15px; pointer-events: none;
  opacity: 0; transform: translateY(-6px); transition: opacity 0.2s, transform 0.2s; }
#note.on { opacity: 1; transform: none; }
@keyframes hit { 0% { box-shadow: 0 0 0 0 rgba(255, 170, 120, 0.9); background: rgba(255, 150, 100, 0.6); } 100% { box-shadow: 0 0 0 18px rgba(255, 170, 120, 0); } }
.hit { animation: hit 0.6s ease-out; }
#pause i { display: block; width: 5px; height: 16px; border-radius: 2px; background: #fff; opacity: 0.85; }
#genome { background: linear-gradient(rgba(2, 4, 10, 0.55), transparent 18%, transparent 55%, rgba(2, 4, 10, 0.7) 75%); justify-content: flex-start; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 12px); overflow: hidden; }
#ghead { display: flex; align-items: center; width: 100%; max-width: 420px; gap: 8px; z-index: 1; }
#ghead > div { flex: 1; text-align: center; }
#ghead h1 { margin: 0; font-size: 28px; }
#gsub { margin: -8px 0 0; font-size: 14px; opacity: 0.65; z-index: 1; }
body.paused #hud, body.paused #toast, body.paused #scalebox, body.paused #ver { visibility: hidden; }
#gback { width: 92px; min-height: 44px; font-size: 17px; border-radius: 22px; padding: 4px 8px; }
#ring { width: 100%; max-width: 460px; flex: 1 1 0; min-height: 180px; overflow: visible; }
#ring .slot { cursor: pointer; }
#gchips { display: flex; gap: 8px; align-items: center; z-index: 1; }
#gchips span { white-space: nowrap; font-size: 14px; padding: 5px 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(2, 4, 10, 0.6); }
#gcard { max-height: 34vh; overflow-y: auto; flex-shrink: 0; width: 100%; max-width: 420px; box-sizing: border-box; border-radius: 20px; padding: 10px 16px; background: rgba(8, 22, 34, 0.92); border: 1px solid rgba(120, 220, 255, 0.35); z-index: 1; }
#gcard.no { border-style: dashed; }
#gcard { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), rgba(0,0,0,0.35)); mask-image: linear-gradient(#000 calc(100% - 22px), rgba(0,0,0,0.35)); padding-bottom: 18px; } /* низ гаснет: видно, что карточка листается, а не обрезана */
#gcard h2 { margin: 0; font-size: 21px; font-weight: 600; }
#gcard h2 i { color: #9fe0ff; font-family: ui-monospace, Menlo, monospace; font-size: 17px; }
#gcard .sub { font-size: 13px; opacity: 0.6; margin: 1px 0 6px; }
#gcard p { margin: 0 0 4px; font-size: 14px; line-height: 1.3; text-align: left; opacity: 0.9; display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
#gcard p b { font-weight: 400; opacity: 0.6; }
#gcard p.hint { display: block; opacity: 0.75; }
#gon { width: 100%; max-width: 420px; min-height: 56px; z-index: 1; flex-shrink: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="count"></span><span id="eaten"></span></div>
<div id="ver"></div>
<button id="pause" aria-label="Пауза: геном"><i></i><i></i></button>
<button id="flag" aria-label="Не так: поставить отметку">⚑</button>
<div id="scalebox"><div id="scale"></div>10 мкм</div>
<div class="layer" id="genes"><h1>Две дочки</h1><p>Они получились разными. Коснись той, кем плыть дальше</p><div id="cards"></div></div>
<div class="layer" id="end">
  <div id="card"><div id="who"></div><h2 id="cname"></h2><p id="ctext"></p><p id="cfact"></p><p id="ctip"></p></div>
  <div id="path"><h3>Твой путь</h3><p id="stats"></p></div>
  <div id="ebtns"><button id="nightgo">Ночь рода</button><button id="again" class="ghost">Плыть снова</button>
  <button id="cab" class="ghost"></button>
  <button id="eno" class="flag ghost">⚑ Не так</button><button id="esend" class="ghost" style="display:none"></button></div>
</div>
<div class="layer" id="night">
  <div id="nhead"><button id="nback" class="ghost">Назад</button><b id="ngen"></b><button id="nflag" class="ghost" aria-label="Не так: поставить отметку">⚑</button></div>
  <p id="nask">Выбери, что будет мешать твоему роду</p>
  <div id="ndanger"><button data-d="phage"><img alt="">Фаги</button><button data-d="maw"><img alt="">Пасть</button><button data-d="hunger"><img alt="">Голод</button></div>
  <div id="nbox"><canvas id="ncv"></canvas></div>
  <p id="nnote">1000 поколений в пробирке — около двух недель: одно деление ≈ 20 минут</p>
  <div id="npicks"></div>
  <button id="ngo" disabled>Плыть этой веткой</button>
</div>
<div class="layer" id="genome">
  <div id="ghead"><button id="gback" class="ghost">‹ Плыть</button><div><h1>Геном</h1></div><button id="gflag" class="flag" style="width:48px;min-height:48px;padding:0;border-radius:50%;margin-left:44px" aria-label="Не так">⚑</button></div>
  <p id="gsub"></p>
  <svg id="ring" viewBox="-228 -190 468 375" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="gchips"></div>
  <div id="gcard"></div>
  <button id="gon">Плыть дальше</button>
  <div id="grow"><button id="gcab" class="ghost">Альманах</button><button id="gno" class="flag">⚑ Не так</button></div>
</div>
<div class="layer" id="cabinet">
  <div id="kshelf"><div class="khead"><button id="back" class="round" aria-label="Назад">‹</button><h1>Альманах</h1></div>
    <p id="kcount"></p><div id="kbar"><i></i></div><div id="kpills"></div><div id="shelf"></div></div>
  <div id="kcard" hidden><div class="khead"><button id="kback" class="round" aria-label="К полке">‹</button><h1 id="khead">Альманах</h1></div>
    <div id="kframe"><img id="kimg" alt=""><div id="ksize"></div></div><h2 id="kname"></h2><div id="ktag"></div><div id="kblocks"></div>
    <div id="knav"><button id="kprev"></button><button id="knext"></button></div><button id="kswim">Плыть</button></div>
</div>
<div id="toast"></div>
<div id="note" role="status"></div>
<script type="module" src="main.js"></script>
</body>
</html>
