<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Заплыв · проба</title>
<style>
html, body { margin: 0; height: 100%; background: #02040a; overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, system-ui, sans-serif; color: #fff; }
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
#hud { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 68px; right: 68px; font-size: 17px;
  opacity: 0.75; pointer-events: none; display: flex; justify-content: space-between; }
#scalebox { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom) + 8px); font-size: 12px; opacity: 0.45; pointer-events: none; }
#scale { height: 3px; background: #fff; margin-bottom: 3px; border-radius: 2px; }
#ver { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 6px); font-size: 11px; opacity: 0.3; pointer-events: none; }
.layer { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; background: rgba(2, 4, 10, 0.72); padding: 24px; } /* без размытия под слоем: в WebKit без видеокарты оно дорогое */
.layer.on { display: flex; }
#genes { justify-content: flex-start; padding-top: calc(env(safe-area-inset-top) + 70px); background: linear-gradient(rgba(2, 4, 10, 0.7), transparent 30%, transparent 62%, rgba(2, 4, 10, 0.75)); backdrop-filter: none; -webkit-backdrop-filter: none; }
#cards { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 28px); display: flex; gap: 12px; }
#cards button { width: auto; flex: 1; font-size: 19px; }
#genes .kid { position: absolute; top: 24%; bottom: 30%; width: 46%; background: transparent; border: none; } /* касание самой дочки */
.layer h1 { margin: 0 0 8px; font-size: 32px; font-weight: 600; }
.layer p { margin: 0 0 12px; font-size: 18px; opacity: 0.8; text-align: center; line-height: 1.5; }
#end { justify-content: flex-start; overflow-y: auto; padding: calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 24px); gap: 10px; }
#end button { position: sticky; bottom: 0; flex-shrink: 0; background: rgba(10, 60, 50, 0.92); }
#card, #path { width: min(380px, 100%); box-sizing: border-box; border-radius: 20px; padding: 12px 16px; }
#card { background: rgba(255, 90, 60, 0.1); border: 1px solid rgba(255, 140, 100, 0.35); }
#path { background: rgba(80, 200, 255, 0.07); border: 1px solid rgba(120, 220, 255, 0.25); }
#who { font-size: 15px; opacity: 0.75; }
#card h2 { margin: 2px 0 6px; font-size: 23px; font-weight: 600; }
#path h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; opacity: 0.8; }
#card p, #path p { margin: 0 0 6px; font-size: 15px; line-height: 1.35; text-align: left; opacity: 0.85; }
#cfact::before { content: "Удивительно: "; font-weight: 600; }
#ctip { color: #9ff5d8; }
#cabinet { background: rgba(2, 4, 10, 0.94); justify-content: flex-start; overflow-y: auto; padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px); gap: 8px; }
#shelf { display: flex; flex-direction: column; gap: 10px; width: min(380px, 100%); }
.cardk { border-radius: 18px; padding: 12px 16px; background: rgba(120, 220, 255, 0.07); border: 1px solid rgba(120, 220, 255, 0.25); }
.cardk h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
.cardk p { margin: 0 0 6px; font-size: 15px; line-height: 1.35; text-align: left; opacity: 0.85; }
.cardk .f::before { content: "Удивительно: "; font-weight: 600; }
.cardk.no { opacity: 0.45; border-style: dashed; }
button.ghost { background: transparent; min-height: 52px; font-size: 18px; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 44px); transform: translate(-50%, -10px); padding: 8px 16px; border-radius: 16px;
  background: rgba(120, 220, 255, 0.16); border: 1px solid rgba(120, 220, 255, 0.4); font-size: 15px; white-space: nowrap;
  opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
#toast.on { opacity: 0.95; transform: translate(-50%, 0); }
button { width: min(340px, 86vw); min-height: 64px; border-radius: 22px; border: 1px solid rgba(120, 255, 210, 0.45);
  background: rgba(60, 255, 200, 0.12); color: #fff; font: inherit; font-size: 21px; padding: 10px 16px; }
button small { display: block; font-size: 15px; opacity: 0.7; margin-top: 3px; }
button:active { background: rgba(60, 255, 200, 0.3); }
/* Пауза с геномом (макет design/zaplyv_genom_maket.png) */
#pause { position: fixed; left: 10px; top: calc(env(safe-area-inset-top) + 2px); width: 48px; min-height: 48px; height: 48px; padding: 0; border-radius: 50%;
  background: rgba(2, 4, 10, 0.35); border: 1px solid rgba(120, 255, 210, 0.35); display: flex; align-items: center; justify-content: center; gap: 5px; }
#flag { position: fixed; right: 10px; top: calc(env(safe-area-inset-top) + 2px); width: 48px; min-height: 48px; height: 48px; padding: 0; border-radius: 50%;
  background: rgba(2, 4, 10, 0.35); border: 1px solid rgba(255, 170, 120, 0.45); color: #ffb48a; font-size: 20px; }
button.flag { border-color: rgba(255, 170, 120, 0.55); color: #ffc9a8; background: transparent; }
#gchips button { white-space: nowrap; width: auto; min-height: 32px; font-size: 14px; padding: 5px 12px; border-radius: 16px; }
#grow { display: flex; gap: 10px; width: 100%; max-width: 420px; flex-shrink: 0; z-index: 1; }
#grow button { flex: 1; width: auto; min-height: 46px; font-size: 17px; }
body.paused #flag { visibility: hidden; }
#pause i { display: block; width: 5px; height: 16px; border-radius: 2px; background: #fff; opacity: 0.85; }
#genome { background: linear-gradient(rgba(2, 4, 10, 0.55), transparent 18%, transparent 55%, rgba(2, 4, 10, 0.7) 75%); justify-content: flex-start; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 12px); overflow: hidden; }
#ghead { display: flex; align-items: center; width: 100%; max-width: 420px; gap: 8px; z-index: 1; }
#ghead > div { flex: 1; text-align: center; }
#ghead h1 { margin: 0; font-size: 28px; }
#gsub { margin: -8px 0 0; font-size: 14px; opacity: 0.65; z-index: 1; }
body.paused #hud, body.paused #toast, body.paused #scalebox, body.paused #ver { visibility: hidden; }
#gback { width: 92px; min-height: 44px; font-size: 17px; border-radius: 22px; padding: 4px 8px; }
#ring { width: 100%; max-width: 460px; flex: 1 1 0; min-height: 180px; overflow: visible; }
#ring .slot { cursor: pointer; }
#gchips { display: flex; gap: 8px; z-index: 1; }
#gchips span { white-space: nowrap; font-size: 14px; padding: 5px 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(2, 4, 10, 0.6); }
#gcard { max-height: 34vh; overflow-y: auto; flex-shrink: 0; width: 100%; max-width: 420px; box-sizing: border-box; border-radius: 20px; padding: 10px 16px; background: rgba(8, 22, 34, 0.92); border: 1px solid rgba(120, 220, 255, 0.35); z-index: 1; }
#gcard.no { border-style: dashed; }
#gcard h2 { margin: 0; font-size: 21px; font-weight: 600; }
#gcard h2 i { color: #9fe0ff; font-family: ui-monospace, Menlo, monospace; font-size: 17px; }
#gcard .sub { font-size: 13px; opacity: 0.6; margin: 1px 0 6px; }
#gcard p { margin: 0 0 4px; font-size: 14px; line-height: 1.3; text-align: left; opacity: 0.9; display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
#gcard p b { font-weight: 400; opacity: 0.6; }
#gcard p.hint { display: block; opacity: 0.75; }
#gon { width: 100%; max-width: 420px; min-height: 56px; z-index: 1; flex-shrink: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="count"></span><span id="eaten"></span></div>
<div id="ver"></div>
<button id="pause" aria-label="Пауза: геном"><i></i><i></i></button>
<button id="flag" aria-label="Не так: поставить отметку">⚑</button>
<div id="scalebox"><div id="scale"></div>10 мкм</div>
<div class="layer" id="genes"><h1>Две дочки</h1><p>Они получились разными. Коснись той, кем плыть дальше</p><div id="cards"></div></div>
<div class="layer" id="end">
  <div id="card"><div id="who"></div><h2 id="cname"></h2><p id="ctext"></p><p id="cfact"></p><p id="ctip"></p></div>
  <div id="path"><h3>Твой путь</h3><p id="stats"></p></div>
  <button id="again">Плыть снова</button>
  <button id="cab" class="ghost"></button>
  <button id="eno" class="flag ghost">⚑ Не так</button><button id="esend" class="ghost" style="display:none"></button>
</div>
<div class="layer" id="genome">
  <div id="ghead"><button id="gback" class="ghost">‹ Плыть</button><div><h1>Геном</h1></div><button id="gflag" class="flag" style="width:48px;min-height:48px;padding:0;border-radius:50%;margin-left:44px" aria-label="Не так">⚑</button></div>
  <p id="gsub"></p>
  <svg id="ring" viewBox="-228 -190 468 375" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="gchips"></div>
  <div id="gcard"></div>
  <button id="gon">Плыть дальше</button>
  <div id="grow"><button id="gcab" class="ghost">Кабинет</button><button id="gno" class="flag">⚑ Не так</button></div>
</div>
<div class="layer" id="cabinet"><h1>Кабинет</h1><p>Кого ты встречал в капле</p><div id="shelf"></div><button id="back">Назад</button></div>
<div id="toast"></div>
<script type="module" src="main.js"></script>
</body>
</html>
