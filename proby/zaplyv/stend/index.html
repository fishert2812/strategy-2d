<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Заплыв · стенд навыков</title>
<style>
html, body { margin: 0; height: 100%; background: #04101a; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; color: #fff; }
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
#name { position: fixed; top: calc(env(safe-area-inset-top) + 18px); left: 0; right: 0; text-align: center; font-size: 20px; opacity: 0.8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="name"></div>
<script type="module">
// Стенд навыка: клетка игры (то же объёмное тело body3d.js) и навык из kirpichi.json, по кругу. ?navyk=glotat
// ?zapis=1 — без своего хода времени: съёмка (snyat.cjs) зовёт window.stend(1/30) на каждый кадр, ролик ровный.
import * as THREE from '../three.module.min.js';
import { Bodies } from '../body3d.js';
import { Kirpichi, K, BRICKS } from '../kirpichi.js';
import { Lenta } from '../lenta.js';
import { sobrat, sluchaynaya, VC } from '../vid_chasti.js';
import { obvod_zon } from '../zony.js';
const q = new URLSearchParams(location.search), name = q.get('navyk') || 'glotat', N = K.navyki[name];
document.getElementById('name').textContent = N ? N.nazvanie : 'нет навыка ' + name;
const W = 720, gl = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
gl.setPixelRatio(Math.min(devicePixelRatio, 2.5)); gl.autoClear = false;
let H = W * innerHeight / innerWidth; gl.setSize(innerWidth, innerHeight, false);
const cam = new THREE.OrthographicCamera(0, W, 0, H, -1, 1), scene = new THREE.Scene(), back = new THREE.Scene(), bodies = new Bodies(); bodies.resize(W, H);
// Вода: тёмная бирюзовая толща, сверху светлее, виньетка — как фон игры, без её сетки слизи.
const bg = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.ShaderMaterial({ depthTest: false, side: THREE.DoubleSide, uniforms: { res: { value: new THREE.Vector2(W, H) } },
  vertexShader: 'varying vec2 v; void main(){ v = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'varying vec2 v; void main(){ vec3 c = mix(vec3(0.01, 0.05, 0.08), vec3(0.04, 0.16, 0.2), v.y); float d = length(v - 0.5); gl_FragColor = vec4(c * (1.0 - 0.5 * smoothstep(0.3, 0.8, d)), 1.0); }' }));
bg.position.set(W / 2, H / 2, 0); bg.scale.y = -1; back.add(bg);
// Мягкие точки — тот же слой, что в игре (main.js, Dots): glow складывается светом, ink кладётся краской.
class Dots {
  constructor(max, add, hard = add ? 0.6 : 0.8) { const g = new THREE.InstancedBufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, 1, 0], 3)); g.setIndex([0, 1, 2, 0, 2, 3]);
    this.a = new Float32Array(max * 3); this.c = new Float32Array(max * 4); this.max = max; this.n = 0; this.g = g;
    g.setAttribute('pr', new THREE.InstancedBufferAttribute(this.a, 3).setUsage(THREE.DynamicDrawUsage)); g.setAttribute('col', new THREE.InstancedBufferAttribute(this.c, 4).setUsage(THREE.DynamicDrawUsage));
    const m = new THREE.Mesh(g, new THREE.ShaderMaterial({ uniforms: { hard: { value: hard } }, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending,
      vertexShader: 'attribute vec3 pr; attribute vec4 col; varying vec2 v; varying vec4 vc; void main(){ v = position.xy; vc = col; gl_Position = projectionMatrix * vec4(pr.xy + position.xy * pr.z, 0.0, 1.0); }',
      fragmentShader: 'uniform float hard; varying vec2 v; varying vec4 vc; void main(){ float d = length(v); if (d > 1.0) discard; float a = mix(1.0 - d, 1.0 - smoothstep(0.75, 1.0, d), hard); gl_FragColor = vec4(vc.rgb, vc.a * a * a); }' }));
    m.frustumCulled = false; m.renderOrder = add ? 3 : 4; scene.add(m); }
  put(x, y, r, cr, cg, cb, ca = 1) { if (this.n >= this.max) return; const i = this.n++; this.a.set([x, y, r], i * 3); this.c.set([cr, cg, cb, ca], i * 4); }
  done() { this.g.instanceCount = this.n; this.g.attributes.pr.needsUpdate = this.g.attributes.col.needsUpdate = true; this.n = 0; }
}
const glow = new Dots(6000, true), ink = new Dots(6000, false), tube = new Lenta(6000, scene, 4), soft = new Dots(400, true, 0), kp = new Kirpichi();
const z = 7.5, cell = { x: 0, y: 30, a: -Math.PI / 2, r: 18, w: 8.5 }, food = { x: 4, y: -38 }, scr = (x, y) => [W / 2 + x * z, H * 0.55 + y * z];
// Заготовка способности (шаг с zona): вместо клетки-палочки — случайное существо движка (?sushchestvo=N), навык садится на его зоны.
const bezMeha = z => { if (q.get('meh') === '0' && z && z.chasti && z.chasti.vorsinki) z.chasti = { ...z.chasti, vorsinki: { ...z.chasti.vorsinki, meh_sloi: 0 } }; return z; }; // ?meh=0 — снять без слоя меха (пока мех чинится)
const naZone = !!(N && N.shagi.some(s => s.zona)), zapis = naZone && bezMeha((() => { if (q.get('sushchestvo') === 'nasha') return { ...VC.vidy.nasha, zony: { rot: {}, udar: {}, scepka: {}, posadka: {} } }; let s = (+q.get('sushchestvo') || 3) * 7919 % 2147483647 || 1; const z = sluchaynaya(VC.vidy.nasha, () => (s = s * 16807 % 2147483647) / 2147483647); z.zony = { rot: {}, udar: {}, scepka: {}, posadka: {} }; return z; })());
const poza = zapis && { x: 0, y: 8, a: -Math.PI / 2, tolshchina: Math.min(14, 90 / obvod_zon(zapis, { x: 0, y: 0, a: 0, tolshchina: 1 }).O.dlina) };
const steps = (N && N.shagi) || [], gone = (steps.find(s => s.k === 'rastvorenie') || { ot: 1e9 }).ot, loop = (N ? N.dlit : 1) + 0.7;
let time = 0, t = 0, T = 0, eaten = false; // T — сплошное время съёмки: жгутики и тело существа идут без стыка круга // eaten: еда съедена — до нового круга её нет, на стыке круга она проявляется с нуля
 const rr = i => { const x = Math.sin(i * 91.7) * 43758.5; return x - Math.floor(x); };
const motes = Array.from({ length: 40 }, (_, i) => ({ x: (rr(i) - 0.5) * 140, y: (rr(i + 50) - 0.5) * 220, d: 0.5 + rr(i + 9) * 0.8, r: 0.6 + rr(i + 3) * 2.2, a: 0.05 + rr(i + 7) * 0.12, v: 1 + rr(i + 1) * 3 }));
window.stend = dt => {
  t += dt; T += dt; if (t > loop) { t = 0; kp.list = []; eaten = false; } time = t / loop * 6.283; // всё от фазы круга: последний кадр сходится с первым
  if (t >= 0.5 && !kp.busy() && t < 0.6) kp.play(name, naZone ? { zapis, poza, seed: 7 } : { from: cell, to: food, seed: 7 });
  kp.step(dt); const tk = t - 0.5; cell.x = Math.sin(t / loop * 6.283) * 1.5;
  bodies.begin(); const [x, y] = scr(cell.x, cell.y); for (const [dx, dy, a] of [[-32, -70, 0.6], [34, 55, 2.2], [-30, 90, 1.2]]) { const [ox, oy] = scr(dx + Math.sin(t / loop * 6.283 + a) * 2, dy); bodies.rod(ox, oy, a + Math.sin(t / loop * 6.283) * 0.05, 9 * z * 0.5, 4 * z * 0.5, 0, [0.12, 0.3, 0.35], [0.25, 0.1, 0.22], 9 + a, 0); } // дальние клетки — тусклые, мельче
  if (naZone) { poza.x = cell.x; const [px, py] = scr(poza.x, poza.y); sobrat(zapis, { x: px, y: py, a: poza.a, tolshchina: poza.tolshchina * z, dlina: (zapis.forma.dlina || 2.14) * 2 * poza.tolshchina * z, z, time: T, id: 3, vypuklosti: kp.vypuklosti(zapis) }, bodies); }
  else bodies.rod(x, y, cell.a, cell.r * z * 0.9, cell.w * z, 0, [0.35, 0.85, 1], [0.85, 0.22, 0.62], 3, Math.sin(time) * 2);
  for (const m of motes) { const my0 = m.y - (t / loop) * m.v * 3; const [mx, my] = [W / 2 + (m.x + Math.sin(t / loop * 6.283 + m.v) * 1.5) * z * m.d, H * 0.55 + my0 * z * m.d]; glow.put(mx, my, m.r * z * m.d, 0.5, 0.95, 0.9, m.a); } // взвесь в толще: дальняя мельче и медленнее — глубина
  if (kp.list[0] && kp.list[0].t >= gone) eaten = true; if (!eaten && !naZone) BRICKS.rastvorenie({ P: { ...K.kirpichi.rastvorenie }, p: 0, t: time, F: cell, T: food, r: cell.r, rt: 6 * Math.min(1, t / 0.4), seed: 7, scr, z, glow, ink, tube, soft }); // проявляется за 0,4 с — без скачка на повторе // еда, пока её не взяли: та же капля, что начнёт таять
  kp.draw({ scr, z, glow, ink, tube, soft, time, bodies }); bodies.end(naZone ? T : time); glow.done(); soft.done(); ink.done(); tube.done();
  gl.clear(); gl.render(back, cam); gl.render(bodies.scene, bodies.cam); gl.render(scene, cam);
};
window.stendInfo = { name, dlit: N ? N.dlit : 0, loop, obrazec: N && N.obrazec };
if (!q.get('zapis')) { let last = performance.now(); const go = now => { window.stend(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(go); }; requestAnimationFrame(go); }
window.stendReady = true;
</script>
</body>
</html>
