<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Заплыв · живой мир записью</title>
<style>html, body { margin: 0; height: 100%; background: #04101a; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; color: #dff; }
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
#p { position: fixed; left: 10px; right: 10px; bottom: max(8px, env(safe-area-inset-bottom)); font-size: 12px; line-height: 1.3; padding: 6px 10px; border-radius: 10px; background: rgba(4, 16, 26, 0.7); pointer-events: none; }
#k { position: fixed; left: 10px; right: 10px; top: max(12px, env(safe-area-inset-top)); font-size: 14px; line-height: 1.4; padding: 10px 12px; border-radius: 12px; background: rgba(4, 16, 26, 0.78); display: none; pointer-events: none; }
#k b { font-size: 16px; } #k small { opacity: 0.7; }
canvas { touch-action: none; }</style></head>
<body><canvas id="c"></canvas><div id="p"></div><div id="k"></div>
<script type="module">
import { Proigryvatel } from '../proigryvatel.js'; const SPOSOB = new URLSearchParams(location.search).get('sposobnost'); let PR = null; // ?sposobnost=ключ — способность из sposobnosti.json проигрывается на существе
// Стенд живого мира: мир из записи (mir.json), существа из записей (vid_chasti.json), жизнь по общим законам (mir_zhizn.js).
// Ничего не нарисовано руками: каждое существо — sobrat(запись, поза). ?mir=kaplya&seed=1&z=1.6&x=&y= — окно камеры; ?vid=infuzoriya — камера
// идёт за первым существом вида; ?zapis=1 — без своего цикла, шаг зовётся window.stend(dt) (для кадров и замеров); ?skor=4 — время быстрее.
import * as THREE from '../three.module.min.js';
import { Bodies } from '../body3d.js';
import { sobrat } from '../vid_chasti.js';
import { sozdat, shag, perepis, oblik, tolshchina, MR } from '../mir_zhizn.js';
const q = new URLSearchParams(location.search), skor = +(q.get('skor') || 1); let z = +(q.get('z') || 1.6), za = q.get('vid'), vybr = null, okno = [0, 0];
const W = 720, gl = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); gl.setPixelRatio(Math.min(devicePixelRatio, 2.5)); gl.autoClear = false;
const H = W * innerHeight / innerWidth; gl.setSize(innerWidth, innerHeight, false);
const cam = new THREE.OrthographicCamera(0, W, 0, H, -1, 1), back = new THREE.Scene(), bodies = new Bodies(); bodies.resize(W, H);
// на стенде закон хода включён (?hod=0 — прежнее ровное скольжение, на нём выверено равновесие видов шага 72)
const imya = q.get('mir') || 'kaplya', K0 = JSON.parse(JSON.stringify(MR)); if (q.get('hod') !== '0') K0.miry[imya].hod = true;
const M = sozdat(imya, +(q.get('seed') || 1), K0), P = M.pole, G = P.shag_setki;
// Вода и еда: фон темнее в глубине, еда светится тёплым там, где её больше (поле рисуется одной текстурой, без частиц).
const tex = new THREE.DataTexture(new Uint8Array(P.nx * P.ny), P.nx, P.ny, THREE.RedFormat); tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearFilter;
const U = { eda: { value: tex }, okno: { value: new THREE.Vector4() }, t: { value: 0 } };
const bg = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.ShaderMaterial({ depthTest: false, side: THREE.DoubleSide, uniforms: U,
  vertexShader: 'varying vec2 v; void main(){ v = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform sampler2D eda; uniform vec4 okno; uniform float t; varying vec2 v; void main(){ vec2 m = okno.xy + v * okno.zw; float e = texture2D(eda, m).r; float d = length(v - 0.5); vec3 c = mix(vec3(0.012, 0.05, 0.085), vec3(0.03, 0.13, 0.17), v.y) * (1.0 - 0.5 * smoothstep(0.3, 0.8, d)); c += vec3(0.20, 0.15, 0.05) * smoothstep(0.03, 0.5, e); gl_FragColor = vec4(c, 1.0); }' }));
bg.position.set(W / 2, H / 2, 0); bg.scale.y = -1; back.add(bg);
let cx = +(q.get('x') || M.W / 2), cy = +(q.get('y') || M.H / 2), time = 0, kadr = 0; const p = document.getElementById('p');
// Потрогать: палец ведёт камеру, два пальца меняют масштаб, касание существа открывает его запись и камера идёт за ним.
const kart = document.getElementById('k'), cv = document.getElementById('c'), pal = new Map(), km = () => W / innerWidth, Z_OT = Math.max(W / M.W, H / M.H), Z_DO = 5; let put = 0, shchip = 0;
const kartochka = s => { const zp = s.zapis, [imya, ...opis] = (zp._ || s.vid).split(': '), f = zp.forma || {};
  kart.innerHTML = '<b>' + imya + '</b><br>' + opis.join(': ').split(' Образец')[0] + '<br><small>Запись: тело ' + (f.tochki ? 'из ' + f.tochki.length + ' точек оси' : f.tip) + (f.vetki ? ', ветвей ' + f.vetki.length : '') + ' · части: ' + Object.keys(zp.chasti || {}).map(k => MR.slova[k] || k).join(', ') + ' · зоны: ' + (Object.keys(zp.zony || {}).map(k => MR.slova[k] || k).join(', ') || 'оболочка') + '<br>Сейчас: размер ' + s.m.toFixed(2) + (s.pokoy ? ' · в покое' : s.syt > 0 ? ' · сыт, переваривает' : ' · ищет еду') + '</small>'; kart.style.display = 'block'; };
const tknut = (px, py) => { const wx = okno[0] + px * km() / z, wy = okno[1] + py * km() / z; let best = null, bd = 1e9;
  for (const s of M.sv) { const d = Math.hypot(s.x - wx, s.y - wy) - Math.max(tolshchina(M, s) * 1.5, 22 * km() / z); if (d < bd) { bd = d; best = s; } }
  if (best && bd < 0) { vybr = best.id; za = null; kartochka(best); } else { vybr = null; kart.style.display = 'none'; } };
cv.addEventListener('pointerdown', e => { pal.set(e.pointerId, [e.clientX, e.clientY]); if (pal.size === 1) put = 0; shchip = 0; });
cv.addEventListener('pointermove', e => { const a = pal.get(e.pointerId); if (!a) return; const dx = e.clientX - a[0], dy = e.clientY - a[1]; a[0] = e.clientX; a[1] = e.clientY;
  if (pal.size > 1) { const [p1, p2] = [...pal.values()], d = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]); if (shchip) z = Math.max(Z_OT, Math.min(Z_DO, z * d / shchip)); shchip = d; put = 99; return; }
  put += Math.hypot(dx, dy); if (put > 8) { za = null; vybr = null; kart.style.display = 'none'; cx -= dx * km() / z; cy -= dy * km() / z; } });
const otpustil = tap => e => { if (!pal.delete(e.pointerId)) return; shchip = 0; if (tap && put <= 8 && !pal.size) tknut(e.clientX, e.clientY); };
cv.addEventListener('pointerup', otpustil(true)); cv.addEventListener('pointercancel', otpustil(false));
cv.addEventListener('wheel', e => { z = Math.max(Z_OT, Math.min(Z_DO, z * Math.exp(-e.deltaY * 0.001))); }, { passive: true });
window.mirTknut = tknut; window.mir = M; window.stendGL = gl; window.mirShag = (n, dt) => { for (let i = 0; i < n; i++) shag(M, dt); };
window.stend = dt => { time += dt; for (let i = 0; i < skor; i++) shag(M, dt);
  const o = vybr ? M.sv.find(s => s.id === vybr) : za && M.sv.find(s => s.vid === za); if (o) { cx += (o.x - cx) * 0.05; cy += (o.y - cy) * 0.05; } else if (vybr) { vybr = null; kart.style.display = 'none'; }
  const vw = W / z, vh = H / z; cx = Math.max(vw / 2, Math.min(M.W - vw / 2, cx)); cy = Math.max(vh / 2, Math.min(M.H - vh / 2, cy)); const x0 = Math.max(0, cx - vw / 2), y0 = Math.max(0, cy - vh / 2); let vidno = 0; okno = [x0, y0];
  if (o && vybr && kadr % 15 === 0) kartochka(o);
  bodies.begin();
  for (const s of M.sv) { const ob = oblik(M, s), w = ob.tolshchina * z, sx = (s.x - x0) * z, sy = (s.y - y0) * z, kr = w * 4; if (sx < -kr || sx > W + kr || sy < -kr || sy > H + kr) continue; vidno++;
    sobrat(ob.zapis, { x: sx, y: sy, a: s.a + (s.kach || 0), gnut: s.gnut_vid, tolshchina: w, z, time, id: s.id, vetki: PR ? PR.kp.vetki(ob.zapis) : undefined, beg: (s.vb = (s.vb ?? s.plyvet) + (s.plyvet - (s.vb ?? s.plyvet)) * Math.min(1, dt * 12)) }, bodies); }
  if (SPOSOB) (PR ??= new Proigryvatel(W, H, SPOSOB)).vMire(dt, M, oblik, x0, y0, z, W, H, bodies, za);
  bodies.end(time);
  if (kadr++ % 6 === 0) { const d = tex.image.data; for (let i = 0; i < d.length; i++) d[i] = Math.min(255, P.C[i] * 255); tex.needsUpdate = true; }
  U.okno.value.set(x0 / (P.nx * G), y0 / (P.ny * G), vw / (P.nx * G), vh / (P.ny * G)); U.t.value = time;
  gl.clear(); gl.render(back, cam); gl.render(bodies.scene, bodies.cam); if (PR) PR.render(gl); window.vidno = vidno;
  if (kadr % 30 === 1) { const n = perepis(M); p.textContent = 'Живой мир записью · ' + Math.round(M.t) + ' с · существ ' + M.sv.length + ' (на экране ' + vidno + ') · видов ' + Object.keys(n).length + ' · родилось ' + M.schet.rodilos + ' · съедено ' + (M.schet.syel + M.schet.proboy) + ' · голод ' + M.schet.golod + ' · мутантов ' + M.schet.mutantov; } };
if (!q.get('zapis')) { let last = performance.now(); const go = now => { window.stend(Math.max(0.001, Math.min(0.05, (now - last) / 1000))); last = now; requestAnimationFrame(go); }; requestAnimationFrame(go); }
window.stendReady = true;
</script></body></html>
