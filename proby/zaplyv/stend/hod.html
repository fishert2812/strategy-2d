<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Заплыв · ход одной клетки</title>
<style>html, body { margin: 0; height: 100%; background: #04101a; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; color: #dff; }
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
#p { position: fixed; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); padding: 10px 12px; border-radius: 14px; background: rgba(4, 16, 26, 0.8); font-size: 14px; line-height: 1.35; }
#p label { display: flex; align-items: center; gap: 8px; margin-top: 6px; } #p label span { flex: 0 0 46%; } #p input[type=range] { flex: 1; }
#h { opacity: 0.85; min-height: 3.9em; } #h b { font-size: 16px; }</style></head>
<body><canvas id="c"></canvas><div id="p"><div id="h"></div><div id="r"></div></div>
<script type="module">
// Стенд хода одной клетки: существо из записи (vid_chasti.json) плывёт по закону хода движка (hod.js, числа mir.json «hod»), ничего
// не подкручено под вид. Ползунки меняют запись (число жгутиков, длина тела, жгутик на корме), ход пересчитывается сам из величин
// zakony.js. Касание воды кладёт туда еду: клетка идёт к ней пробегами и кувырками. ?sushchestvo=seno — другая запись;
// ?zapis=1 — без своего цикла, шаг зовётся window.stend(dt) (для роликов и замеров); ?seed=2 — другой случай.
import * as THREE from '../three.module.min.js';
import { Bodies } from '../body3d.js';
import { sobrat, VC } from '../vid_chasti.js';
import { plyt, pasport_hoda } from '../hod.js';
import { kontakt, tolshche } from '../pitanie.js';
import { obvod_zon } from '../zony.js';
const q0 = new URLSearchParams(location.search), MR = await (await fetch('../mir.json')).json(), K = MR.hod, KK = MR.kontakt, Z = MR.zhizn, S = K.stend, vid = VC.vidy[q0.get('sushchestvo')] ? q0.get('sushchestvo') : 'nasha';
const W = 720, gl = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); gl.setPixelRatio(Math.min(devicePixelRatio, 2.5)); gl.autoClear = false;
const H = W * innerHeight / innerWidth; gl.setSize(innerWidth, innerHeight, false);
const cam = new THREE.OrthographicCamera(0, W, 0, H, -1, 1), back = new THREE.Scene(), bodies = new Bodies(); bodies.resize(W, H);
// Вода: мягкие пятна света привязаны к воде, а не к экрану, поэтому по ним видно, как клетка идёт.
const U = { o: { value: new THREE.Vector2() }, m: { value: new THREE.Vector2(W, H) } };
const bg = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.ShaderMaterial({ depthTest: false, side: THREE.DoubleSide, uniforms: U,
  vertexShader: 'varying vec2 v; void main(){ v = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec2 o; uniform vec2 m; varying vec2 v; void main(){ vec2 p = (o + v * m) / 190.0; float n = sin(p.x * 1.3 + sin(p.y * 0.9) * 1.7) * sin(p.y * 1.1 + sin(p.x * 0.7) * 1.9); n += 0.5 * sin(p.x * 2.9 + 1.0 + sin(p.y * 2.3) * 1.3) * sin(p.y * 3.1 + sin(p.x * 2.6)); float d = length(v - 0.5); vec3 c = mix(vec3(0.012, 0.05, 0.085), vec3(0.03, 0.13, 0.17), v.y) * (1.0 - 0.5 * smoothstep(0.3, 0.8, d)); c += vec3(0.02, 0.07, 0.08) * smoothstep(-0.2, 1.2, n); gl_FragColor = vec4(c, 1.0); }' }));
bg.position.set(W / 2, H / 2, 0); bg.scale.y = -1; back.add(bg);
let s = (+(q0.get('seed') || 1)) * 2654435761 % 2147483647 || 1; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647, hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
// Запись под ползунками: каждый раз новая копия записи вида, поэтому паспорт хода и величины считаются заново.
const P0 = { zhg: VC.vidy[vid].chasti.zhgutiki ? VC.vidy[vid].chasti.zhgutiki.n ?? VC.chasti.zhgutiki.n : 0, dl: 1, korma: VC.vidy[vid].chasti.zhgutiki?.gde === 'korma' ? 1 : 0 }, PZ = { ...P0 }; let zapis, PH, vmax = 0, TL, zerna = -1;
function sobrat_zapis() { const z = JSON.parse(JSON.stringify(VC.vidy[vid])); z.forma.tochki = z.forma.tochki.map(([x, y, r]) => [x * PZ.dl, y, r]);
  if (PZ.zhg > 0) { z.chasti.zhgutiki = { ...(z.chasti.zhgutiki || {}), n: PZ.zhg }; if (PZ.korma) z.chasti.zhgutiki.gde = 'korma'; else delete z.chasti.zhgutiki.gde; } else delete z.chasti.zhgutiki;
  if (zerna >= 0 && z.chasti.vklyucheniya) z.chasti.vklyucheniya = { ...z.chasti.vklyucheniya, n: zerna };
  zapis = z; PH = pasport_hoda(z, K, 1); const O = obvod_zon(z, { x: 0, y: 0, a: 0, tolshchina: 1 }).O; TL = { kr: O.poperechnik / 2, kh: Math.max(0, O.dlina / 2 - O.poperechnik / 2) }; }
const q = { id: 1, x: 0, y: 0, a: -1.2, m: 1, pokoy: 0, udar: 0 }, VM = new Map(), E = S.eda;
// Еда и комки лежат в воде по сетке (случай от места, поэтому мир повторяется); съеденный кусок через время нарастает снова.
const veshch = (i, j) => { const kl = i + ',' + j; let e = VM.get(kl); if (e === undefined) { const h1 = hash(i * 3 + 1, j * 7 + 2), x = (i + 0.2 + 0.6 * hash(i, j)) * E.shag, y = (j + 0.2 + 0.6 * hash(j + 7, i)) * E.shag;
  e = (i || j) && h1 < E.komok ? { x, y, m: 1, r: S.tolshchina * (E.r_komka[0] + (E.r_komka[1] - E.r_komka[0]) * hash(i + 5, j)), tverd: true } : h1 < E.komok + E.shans ? { x, y, m: E.m[0] + (E.m[1] - E.m[0]) * hash(i + 9, j + 4), r: 0 } : null; if (e && !e.tverd) e.r = S.tolshchina * E.r * Math.cbrt(e.m / E.m[1]); VM.set(kl, e); } return e; }; let cx = 0, cy = 0, time = 0, kadr = 0, vb = 1, sk_sred = 0, put = 0, ryadom = [], palec = [];
const SLOVA = { beg: 'бежит, пучок собран', kuvyrok: 'кувырок, пучок распался', nazad: 'задний ход', povorot: 'отворачивает' }, TIP = { beg: 'жгутики по телу: бег и кувырок', polus: 'жгутик на корме: бег, задний ход, щелчок', spiral: 'реснички: ход по винту', drozh: 'грести нечем: только дрожь воды' };
const h = document.getElementById('h'), r = document.getElementById('r');
const polzunok = (imya, kl, ot, do_, shag) => { const l = document.createElement('label'); l.innerHTML = '<span>' + imya + '</span><input type="range" min="' + ot + '" max="' + do_ + '" step="' + shag + '" value="' + PZ[kl] + '">'; l.firstChild.nextSibling.addEventListener('input', e => { PZ[kl] = +e.target.value; sobrat_zapis(); }); r.appendChild(l); };
polzunok('Жгутиков', 'zhg', 0, S.zhgutikov_do, 1); polzunok('Длина тела', 'dl', S.dlina[0], S.dlina[1], 0.05); polzunok('Жгутик на корме', 'korma', 0, 1, 1); sobrat_zapis();
window.hodZapis = (kl, v) => { PZ[kl] = v; sobrat_zapis(); }; window.hodSost = () => ({ m: q.m, est: !!q.est, x: q.x, y: q.y, a: q.a, kach: q.kach, faza: q.h?.faza, vmax, PH });
document.getElementById('c').addEventListener('pointerdown', e => { const m = W / innerWidth; palec.push({ x: cx - W / 2 + e.clientX * m, y: cy - H / 2 + e.clientY * m, m: E.m[1], r: S.tolshchina * E.r }); });
window.stend = dt => { time += dt; const w = S.tolshchina * tolshche(q, KK, time), g = E.shag;
  ryadom = palec = palec.filter(e => e.m > 0); ryadom = ryadom.slice(); for (let j = Math.floor((cy - H) / g); j <= (cy + H) / g; j++) for (let i = Math.floor((cx - W) / g); i <= (cx + W) / g; i++) { const e = veshch(i, j); if (e && e.m > 0) ryadom.push(e); }
  const KT = kontakt(q, ryadom, TL, w, KK, PH.k_eda, dt); let d = 0; if (KT.cel) { d = Math.atan2(KT.cel[1] - q.y, KT.cel[0] - q.x) - q.a; d = Math.atan2(Math.sin(d), Math.cos(d)); }
  const zr = Math.round(S.zerna[0] + (S.zerna[1] - S.zerna[0]) * Math.max(0, Math.min(1, (q.m - 1) / (KK.m_max - 1)))); if (zr !== zerna) { zerna = zr; sobrat_zapis(); }
  const { X, vmax: vm } = plyt(q, zapis, K, Z, dt, rnd, d, w, KT.sk); vmax = vm / (KT.sk || 1); const vv = Math.hypot(q.vx, q.vy); window.hodSobytiya = (window.hodSobytiya || 0) + KT.sobytiya.length;
  cx += (q.x - cx) * Math.min(1, dt * S.kamera); cy += (q.y - cy) * Math.min(1, dt * S.kamera); vb += ((vmax > 0 ? X.beg : 0) - vb) * Math.min(1, dt * 12); sk_sred += (Math.abs(vv) - sk_sred) * Math.min(1, dt * 2); put += Math.abs(vv) * dt;
  const x0 = cx - W / 2, y0 = cy - H / 2; U.o.value.set(x0, y0); bodies.begin();
  // взвесь в воде: редкие мутные крупинки стоят на месте (сетка по воде), по ним видно ход и дрожь
  const gv = S.vzves.shag; for (let j = Math.floor(y0 / gv); j <= (y0 + H) / gv; j++) for (let i = Math.floor(x0 / gv); i <= (x0 + W) / gv; i++) { const px = (i + hash(i, j)) * gv - x0, py = (j + hash(j + 7, i)) * gv - y0; bodies.sphere(px, py, S.vzves.r * (0.5 + hash(i + 3, j)), S.vzves.cvet, S.vzves.cvet, i * 31 + j, 0.6, S.vzves.a); }
  // кусок, который едят, тает: вокруг растекается бледный ореол (как melts в fx.js игры)
  if (q.est) { const e = q.est, f = 1 - e.r / e.r0; bodies.sphere(e.x - x0, e.y - y0, e.r0 * (1 + E.oreol * f), E.cvet, E.kromka, 3, 0.4, E.oreol_a * (1 - f)); }
  for (const e of ryadom) if (e.r > 0.3) bodies.sphere(e.x - x0, e.y - y0, e.r, e.tverd ? E.cvet_komka : E.cvet, e.tverd ? E.kromka_komka : E.kromka, Math.round(e.x + e.y * 3), e.tverd ? 0.9 : 0.8, 1);
  sobrat(zapis, { x: q.x - x0, y: q.y - y0, a: q.a + q.kach, tolshchina: w, z: 1, time, id: 1, beg: vb, gnut: q.gnut }, bodies); bodies.end(time);
  gl.clear(); gl.render(back, cam); gl.render(bodies.scene, bodies.cam);
  if (kadr++ % 6 === 0) h.innerHTML = '<b>' + (zapis._ || vid).split(/[:(]/)[0].trim() + '</b> · ' + TIP[PH.tip] + '<br>Сейчас: ' + (q.est ? 'ест: кусок тает на оболочке' : q.upor > 0 ? 'упёрлась в комок' : PH.tip === 'drozh' ? 'дрожит' : SLOVA[q.h.faza]) + ' · масса ' + q.m.toFixed(2) + ' · скорость ' + (sk_sred / (2 * w)).toFixed(1) + ' толщин тела в секунду<br>Из записи: наибольшая ' + (vmax / (2 * w)).toFixed(1) + ' · качание носа ' + (PH.kach * 57.3).toFixed(0) + '° · кувырок до ' + (PH.ugol * 1.7 * 57.3).toFixed(0) + '° · дрожь ' + (PH.vert / K.drozh.povorot).toFixed(2) + ' от образца'; };
if (!q0.get('zapis')) { let last = performance.now(); const go = now => { window.stend(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(go); }; requestAnimationFrame(go); }
window.stendReady = true;
</script></body></html>
