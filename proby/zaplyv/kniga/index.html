  ['Умения и эволюция', [['umeniya', 'Навыки: таблица', 'Каждый навык: что делает, кадр из игры, настоящий референс, что сделать ярче'], ['razbor', 'Навыки: разбор', 'Зачем брать навык, как он ощущается, уровни и сочетания'], ['katalog', 'Каталог умений', 'Все семьдесят умений из природы и какие уже в книге'], ['razvitie', 'Развитие умений', 'Как умение растёт и меняется'], ['geny', 'Гены', 'Умения клетки и новые из каталога биолога'], ['navyki', 'Навыки', 'Умения, которые включаешь жестом'], ['puti', 'Пути генов', 'Откуда умение приходит'], ['evolyuciya', 'Эволюция', 'Режимы: ночь рода, свои породы, хищники'], ['geroy', 'Герой', 'За кого играешь и что растёт вместе с тобой']]],
  ['Мир впереди', [['eda', 'Еда', 'Чем питается клетка'], ['sreda', 'Среда', 'Свет, кислород, слизь, течение'], ['sosedi', 'Соседи', 'Новые существа'], ['il', 'Ил', 'Жизнь на дне'], ['karta', 'Карта', 'Пруд целиком и встречи'], ['doma', 'Домой', 'Куда ведёт заплыв']]],
  ['Как работаем', [['razrabotka', 'В разработке', 'Что ждёт твоего «да» и что уже утверждено'], ['plan', 'План: слои', 'Прежний порядок больших шагов, 24.11'], ['nauka', 'Наука', 'Источники и замеры'], ['zhurnal', 'Журнал', 'Что менялось в книге по версиям']]]];
const PAGES = [['oblozhka', 'Книга'], ...GRUPPY.flatMap(g => g[1].map(p => [p[0], p[1]]))];
// Записи книги: один пункт — одна запись в zapisi/*.json. Их же читает сверка с игрой (sverka.mjs).
const SHAG = { nauka: ['1', 'база науки'], adaptaciya: ['2', 'адаптация'], biolog: ['3', 'у биолога'], gotov: ['4', 'готов к стройке'], stroyka: ['5', 'строим'], v_igre: ['6', 'в игре'] };
let Z = null, PR = [], KK = null, RS = null, AN = [], VID = { sushchestva: [] }, FZ = { formuly: [], yavleniya: [] }, PI = { punkty: [] }, OT = [], UM = { v_igre: [], ne_v_igre: [] };
// Решения Романа: ответы живут в этом браузере, «Отправить ответы» отдаёт их одним сообщением через «Поделиться».
const otvety = () => { try { return JSON.parse(localStorage.getItem('zaplyv_resheniya') || '{}'); } catch { return {}; } };
const pismo = (o, ver) => 'Решения по книге «Заплыва» ' + ver + ':\n' + RS.resheniya.filter(r => o[r.id]).map(r => `${r.id} ${r.zagolovok}: ${o[r.id]}`).join('\n');
const ZN = { est: ['🍽', 'ест'], byot: ['⚔️', 'бьёт или травит'], zarazhaet: ['🦠', 'заражает'], pomogaet: ['🤝', 'помогает, кормит, учит'], sopernik: ['🥊', 'соперник за еду'], nichego: ['·', 'не трогает'], vopros: ['?', 'вопрос биологу'] };
const KST = { igra: ['в игре', 6], zapis: ['задумано', 4], nauka: ['наука есть, в игре нет', 3], pusto: ['пусто, у биолога', 1] };
async function zapisi() {
  if (Z) return Z;
  const files = await (await fetch('zapisi/spisok.json', { cache: 'no-cache' })).json();
  Z = (await Promise.all(files.map(async f => (await (await fetch('zapisi/' + f + '.json', { cache: 'no-cache' })).json()).map(r => ({ ...r, file: f }))))).flat();
  PR = await (await fetch('problemy.json', { cache: 'no-cache' })).json();
  OT = await (await fetch('otzyvy/spisok.json', { cache: 'no-cache' })).json();
  UM = await (await fetch('umeniya.json', { cache: 'no-cache' })).json();
  KK = await (await fetch('kto_s_kem.json', { cache: 'no-cache' })).json();
  RS = await (await fetch('resheniya.json', { cache: 'no-cache' })).json();
  AN = await (await fetch('animacii.json', { cache: 'no-cache' })).json();
  VID = await (await fetch('vid.json', { cache: 'no-cache' })).json();
  FZ = await (await fetch('fizika.json', { cache: 'no-cache' })).json();
  PI = await (await fetch('plan_igry.json', { cache: 'no-cache' })).json();
  return Z;
}
const krug = (r, k, n) => `<span class="${r.krugi && r.krugi[k] ? 'ok' : 'no'}">${r.krugi && r.krugi[k] ? '●' : '○'} ${n}${r.krugi && r.krugi[k] ? ' (' + esc(r.krugi[k]) + ')' : ''}</span>`;
const row = (b, v) => v ? `<div class="r"><b>${b}</b><span>${inline(v)}</span></div>` : '';
const zhdet = r => r.novaya && !r.roman;
function zapis(r) {
  return `<div class="card"><div class="t"><span class="code">${r.id}</span>${inline(r.name)}</div>` +
    `<div class="step s${SHAG[r.shag][0]}">шаг ${SHAG[r.shag][0]} из 6 · ${zhdet(r) && r.shag === 'gotov' ? 'наука и план готовы' : SHAG[r.shag][1]}${r.versiya ? ' с ' + r.versiya : ''}</div>` +
    (zhdet(r) ? '<div class="step s3">новая механика · ждёт Романа</div>' : r.roman ? `<div class="step s6">Роман: ${esc(r.roman)}</div>` : '') +
    (r.zamechanie ? `<div class="r warn"><b>Замечание</b><span>${inline(r.zamechanie)}</span></div>` : '') + row('В игре', r.igra) + row('Наука', r.nauka) + row('Образец', r.referens) +
    (r.stroit ? `<details><summary>Для строителя</summary>${row('Как строить', r.stroit)}${row('Проверка', r.proverka)}</details>` : '') +
    `<div class="krugi">${krug(r, 'biolog', 'биолог')} ${krug(r, 'stroitel', 'строитель')} ${krug(r, 'igrok', 'игрок')}</div></div>`;
}
function ochered() {
  const out = [], line = r => `<li><span class="code">${r.id}</span>${inline(r.name)}${r.versiya ? ' · ' + r.versiya : ''}</li>`;
  const wait = Z.filter(r => !(r.krugi && r.krugi.biolog));
  out.push(`<div class="card"><div class="t">Всего записей: ${Z.length}</div>` + Object.entries(SHAG).map(([k, [n, name]]) =>
    `<div class="r"><b>${n}. ${name}</b><span>${Z.filter(r => r.shag === k).length}</span></div>`).join('') + '</div>');
  const zr = Z.filter(zhdet); if (zr.length) out.push(`<h2>Ждут Романа: ${zr.length}</h2><p>Новые механики. В стройку идут только после его «да» по номеру. Список на вкладке «В разработке».</p>`);
  if (wait.length) out.push(`<h2>Ждут биолога: ${wait.length}</h2><ul>${wait.map(line).join('')}</ul>`);
  for (const [k, [n, name]] of Object.entries(SHAG).reverse()) {
    const rs = Z.filter(r => r.shag === k && !(k === 'gotov' && zhdet(r)));
    if (rs.length) out.push(`<h2>${n}. ${name[0].toUpperCase() + name.slice(1)}: ${rs.length}</h2><ul>${rs.map(line).join('')}</ul>`);
  }
  return out.join('');
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  return esc(s)
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" loading="lazy">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([А-ЯA-Z]{1,2}\d{1,3})\*\*/g, '<span class="code">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/⚠️[^·|]*/g, m => '<span class="warn">' + m + '</span>');
}
const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
function render(md) {
  const L = md.split('\n'), out = [];
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (!l.trim()) continue;
    let m;
    if ((m = l.match(/^\*\*((?:Л[А-Я]|ПР|ЦВ|Ч|Н|Г)\d+)\.(?: (.+?)\.?)?\*\*\s*(.*)$/))) { // пункт логики режима: карточка с номером (кнопку ✎ ставит панель) до следующего пункта, заголовка или черты
      let j = i + 1; while (j < L.length && !/^\*\*(?:Л[А-Я]|ПР|ЦВ|Ч|Н|Г)\d+\./.test(L[j]) && !/^#{1,3} /.test(L[j]) && !/^---+$/.test(L[j].trim())) j++;
      out.push(`<div class="card"><div class="t"><span class="code">${m[1]}</span>${inline(m[2] || '')}</div>${render([m[3], '', ...L.slice(i + 1, j)].join('\n'))}</div>`); i = j - 1; continue; }
    if ((m = l.match(/^(#{1,3}) (.*)/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if (/^---+$/.test(l.trim())) { out.push('<hr>'); continue; }

    if (l.trim() === '{{resheniya}}') { const o = otvety(), byId = Object.fromEntries(Z.map(r => [r.id, r]));

      const gr = {}; for (const r of zr) (gr[r.file] = gr[r.file] || []).push(r);

        (da.length ? '<h2>Утверждено</h2><ul>' + da.map(r => `<li><span class="code">${r.id}</span>${inline(r.name)} · ${esc(r.roman)}</li>`).join('') + '</ul>' : '')); continue; }
    if (l.trim() === '{{oglavlenie}}') { out.push(GRUPPY.map(g => `<h3>${g[0]}</h3>` + g[1].map(([k, n, d]) => `<a class="tile" href="#${k}"><b>${n}</b><span>${d}</span></a>`).join('')).join('')); continue; }
    if ((m = l.match(/^\{\{panel:([a-z_]+)\}\}$/))) { out.push(`<div data-panel="${m[1]}"></div>`); continue; } // крючок рабочей панели: наполняет panel.js (тред панели)
    if (l.trim() === '{{umeniya}}') { const VD = { da: ['видно', 6], slabo: ['видно слабо', 3], net: ['не видно', 3] };
      out.push(`<div class="card"><div class="t">В игре сейчас: ${UM.v_igre.length}</div>` + Object.entries(VD).map(([k, [n]]) => row(n, String(UM.v_igre.filter(u => u.vidno === k).length))).join('') + row('настоящий референс найден', UM.v_igre.filter(u => u.ref && u.ref.url).length + ' из ' + UM.v_igre.length) + '</div>' +
        UM.v_igre.map(u => `<div class="card"><div class="t"><span class="code">${u.nomer}</span>${esc(u.imya)}</div><div class="step s${VD[u.vidno][1]}">${VD[u.vidno][0]} · режим «${esc(u.rezhim)}»</div>${row('По науке', u.nauka)}${row('Что делает', u.daet)}<img alt="${esc(u.imya)} в игре" src="img/navyki/${u.klyuch}.jpg" loading="lazy">${row('На кадре', u.kadr)}${u.moment ? `<img alt="${esc(u.imya)}: момент срабатывания" src="img/navyki/m_${u.klyuch}.jpg" loading="lazy">` + row('В момент', u.moment) : ''}${row('В природе', u.ref ? u.ref.chto : '')}${row('Референс', u.ref && u.ref.url ? `[${u.ref.gde}](${u.ref.url})` : 'не найден, рисовали по описанию')}${row('Близко ли', u.ref ? u.ref.blizko : '')}${row('Что сделать', u.komment)}${u.plan ? `<div class="step">задумано, ждёт твоего «да»</div>${row('Имя сверху', u.plan.nauch)}${row('Под ним', u.plan.imya)}${row('Что это', u.plan.chto)}${u.plan.urovni.map((x, i) => row('Уровень ' + (i + 1), x)).join('')}${u.plan.ne_rabotaet ? row('Не работает', u.plan.ne_rabotaet) : ''}${u.plan.zametka ? row('Заметка', u.plan.zametka) : ''}` : ''}</div>`).join('')); continue; }

    if (l.trim() === '{{fizika_zakony}}') { out.push(FZ.formuly.map(f => `<div class="card"><div class="t"><span class="code">${f.id}</span>${esc(f.imya)}</div>${row('Формула', '**' + f.formula + '**')}${row('Словами', f.slovami)}${row('Пример', f.primer)}</div>`).join('')); continue; }
    if (l.trim() === '{{fizika_yavleniya}}') { const ZM = { 'сильно': 3, 'средне': 4, 'слабо': 6 }; out.push(FZ.yavleniya.map(y => `<div class="card"><div class="t"><span class="code">${y.id}</span>${esc(y.imya)}</div><div class="step s${ZM[y.zametnost] || 3}">расходится ${esc(y.zametnost)}${y.novaya ? ' · новое, ждёт твоего «да»' : ''}</div>${row('В жизни', y.v_zhizni)}${row('Закон', y.zakon.map(z => '**' + z + '**').join(', '))}${row('У нас сейчас', y.u_nas)}${row('Что поменять', y.pomenyat)}${row('Кто делает', y.komu)}</div>`).join('')); continue; }
    if (l.trim() === '{{fizika_merka}}') { out.push('<p>' + inline(FZ.merka || '') + '</p>'); continue; }
    if (l.trim() === '{{fizika_pamyatka}}') { out.push('<p>' + inline(FZ.pamyatka || '') + '</p>'); continue; }

    if (l.trim() === '{{umeniya_net}}') { out.push(UM.ne_v_igre.map(([n, i, d]) => `<div class="card"><div class="t"><span class="code">${n}</span>${esc(i)}</div><div class="step">только в книге</div>${row('Что делает', d)}</div>`).join('')); continue; }
    if (l.trim() === '{{otzyvy}}') { out.push(OT.map(v => `<h2>Версия ${esc(v.versiya)}</h2><p>${esc(v.kogda)}. ${esc(v.kto)}.</p><p><b>Честно:</b> ${esc(v.chestno)}</p>` +
      v.recenzii.map(([f, n]) => `<details class="otz" data-src="otzyvy/${esc(v.versiya)}/${f}.md"><summary>${esc(n)}</summary><div>Открываю…</div></details>`).join('')).join('')); continue; }
    if (l.trim() === '{{ochered}}') { out.push(ochered()); continue; }
    if (l.trim() === '{{kartochki}}') { out.push(Z.filter(r => r.kartochka).map(r => `<div class="card"><div class="t"><span class="code">${r.id}</span>${esc(r.kartochka.imya)} <em>${esc(r.latin || '')}</em></div>` +
      `<div class="step s${SHAG[r.shag][0]}">${r.shag === 'v_igre' ? 'в игре' : r.file === 'mutacii' ? 'новое, идёт в стройку' : 'спит на кольце'}</div>` + row('Что даёт', r.kartochka.daet) + row('В природе', r.kartochka.priroda) + '</div>').join('')); continue; }
    if (l.trim() === '{{sushchestva}}') { out.push(Z.flatMap(r => Object.values(r.sushchestva || {}).map(c => `<div class="card"><div class="t"><span class="code">${r.id}</span>${esc(c.imya)}</div>` + row('Кто это', c.kto) + row('Совет', c.sovet) + row('В бою', c.boy) + (c.korotko ? row('При осмотре', ({ opasen: '⚠ опасен тебе · ', eda: '● еда · ', ne_tronet: '○ не тронет · ' }[c.otnoshenie] || '') + c.korotko + '. ' + c.znachit) : '') + row('В природе', c.priroda) + row('Если убил', c.ubil) + '</div>')).join('')); continue; }
    if (l.startsWith('|')) { // таблица → карточки: первая ячейка — заголовок, остальные — «шапка: значение»

      while (i < L.length && L[i].startsWith('|')) {

async function show() {
  const id = (location.hash.slice(1) || 'oblozhka');
  const page = PAGES.find(p => p[0] === id) ? id : 'oblozhka';
  const gi = GRUPPY.findIndex(g => g[1].some(p => p[0] === page));
  document.getElementById('nav').innerHTML = '<div class="gr">' + `<a href="#oblozhka" class="${gi < 0 ? 'on' : ''}">Главная</a>` + GRUPPY.map((g, i) => `<a href="#${g[1][0][0]}" class="${i === gi ? 'on' : ''}">${g[0]}</a>`).join('') + '</div>' +
    (gi < 0 ? '' : '<div class="tb">' + GRUPPY[gi][1].map(([k, n]) => `<a href="#${k}" class="${k === page ? 'on' : ''}">${n}</a>`).join('') + '</div>');
  document.querySelectorAll('nav a.on').forEach(a => a.scrollIntoView({ inline: 'center', block: 'nearest' }));
  await zapisi();
  if (location.search === '?vse') { // вся книга одной лентой — из неё собирается PDF (pdf.mjs)
    const all = await Promise.all(PAGES.map(async ([k]) => render(await (await fetch(k + '.md', { cache: 'no-cache' })).text())));
    document.getElementById('nav').remove(); document.getElementById('page').innerHTML = all.join('<hr class="pb">');
    document.querySelectorAll('details').forEach(d => d.open = true); document.body.dataset.ready = '1'; return;
  }
  const r = await fetch(page + '.md', { cache: 'no-cache' });
  document.getElementById('page').innerHTML = r.ok ? render(await r.text()) : '<p>Страница не открылась.</p>';
  schet();
  scrollTo(0, 0);
}
document.addEventListener('click', async e => { // решения: «Да», «Нет», «Потом» и отправка
  const b = e.target.closest('.btns button'), s = e.target.closest('#send'), t = document.getElementById('toast');
  const say = m => { t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); };
  if (b) { const o = otvety(), id = b.closest('.resh').dataset.id; if (o[id] === b.dataset.v) delete o[id]; else o[id] = b.dataset.v;
    try { localStorage.setItem('zaplyv_resheniya', JSON.stringify(o)); } catch {}
    b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', o[id] === x.dataset.v)); schet(); }
  if (s) { const o = otvety(); if (!Object.keys(o).length) return say('Сначала ответь хотя бы на одно');
    const text = pismo(o, new Date().toLocaleDateString('ru-RU'));
    try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); say('Скопировано. Вставь в чат'); } } catch (err) { if (err.name !== 'AbortError') { try { await navigator.clipboard.writeText(text); say('Скопировано. Вставь в чат'); } catch { say('Не вышло отправить'); } } } }
});
function schet() { const el = document.getElementById('schet'); if (el) { const n = Object.keys(otvety()).filter(k => RS.resheniya.some(r => r.id === k)).length; el.textContent = 'Отвечено: ' + n + ' из ' + RS.resheniya.length; } }
document.addEventListener('click', e => { // касание номера пункта копирует «Книга Г7: » для чата
  const c = e.target.closest('.code'); if (!c) return;
  const text = 'Книга ' + c.textContent + ': ';
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).catch(() => {});
  const t = document.getElementById('toast'); t.textContent = 'Скопировано: ' + c.textContent; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1400);
});
document.addEventListener('toggle', async e => { // рецензия игрока грузится, когда её раскрыли
  const d = e.target; if (!d.open || !d.dataset || !d.dataset.src || d.dataset.ok) return; d.dataset.ok = '1';
  const r = await fetch(d.dataset.src, { cache: 'no-cache' }); d.lastElementChild.innerHTML = r.ok ? render(await r.text()) : '<p>Рецензия не открылась.</p>';
}, true);
addEventListener('hashchange', show); show();
