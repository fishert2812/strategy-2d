// Записи книги: один пункт — одна запись в zapisi/*.json. Их же читает сверка с игрой (sverka.mjs).
const SHAG = { nauka: ['1', 'база науки'], adaptaciya: ['2', 'адаптация'], biolog: ['3', 'у биолога'], gotov: ['4', 'готов к стройке'], stroyka: ['5', 'строим'], v_igre: ['6', 'в игре'] };
let Z = null, PR = [];
async function zapisi() {
  if (Z) return Z;
  const files = await (await fetch('zapisi/spisok.json', { cache: 'no-cache' })).json();
  Z = (await Promise.all(files.map(async f => (await (await fetch('zapisi/' + f + '.json', { cache: 'no-cache' })).json()).map(r => ({ ...r, file: f }))))).flat();
  PR = await (await fetch('problemy.json', { cache: 'no-cache' })).json();
  return Z;
}
const krug = (r, k, n) => `<span class="${r.krugi && r.krugi[k] ? 'ok' : 'no'}">${r.krugi && r.krugi[k] ? '●' : '○'} ${n}${r.krugi && r.krugi[k] ? ' (' + esc(r.krugi[k]) + ')' : ''}</span>`;
const row = (b, v) => v ? `<div class="r"><b>${b}</b><span>${inline(v)}</span></div>` : '';
function zapis(r) {
  return `<div class="card"><div class="t"><span class="code">${r.id}</span>${inline(r.name)}</div>` +
    `<div class="step s${SHAG[r.shag][0]}">шаг ${SHAG[r.shag][0]} из 6 · ${SHAG[r.shag][1]}${r.versiya ? ' с ' + r.versiya : ''}</div>` +
    (r.zamechanie ? `<div class="r warn"><b>Замечание</b><span>${inline(r.zamechanie)}</span></div>` : '') + row('В игре', r.igra) + row('Наука', r.nauka) + row('Образец', r.referens) +
    (r.stroit ? `<details><summary>Для строителя</summary>${row('Как строить', r.stroit)}${row('Проверка', r.proverka)}</details>` : '') +
    `<div class="krugi">${krug(r, 'biolog', 'биолог')} ${krug(r, 'stroitel', 'строитель')} ${krug(r, 'igrok', 'игрок')}</div></div>`;
}
function ochered() {
  const out = [], line = r => `<li><span class="code">${r.id}</span>${inline(r.name)}${r.versiya ? ' · ' + r.versiya : ''}</li>`;
  const wait = Z.filter(r => !(r.krugi && r.krugi.biolog));
  out.push(`<div class="card"><div class="t">Всего записей: ${Z.length}</div>` + Object.entries(SHAG).map(([k, [n, name]]) =>
    `<div class="r"><b>${n}. ${name}</b><span>${Z.filter(r => r.shag === k).length}</span></div>`).join('') + '</div>');
  if (wait.length) out.push(`<h2>Ждут биолога: ${wait.length}</h2><ul>${wait.map(line).join('')}</ul>`);
  for (const [k, [n, name]] of Object.entries(SHAG).reverse()) {
    const rs = Z.filter(r => r.shag === k);
    if (rs.length) out.push(`<h2>${n}. ${name[0].toUpperCase() + name.slice(1)}: ${rs.length}</h2><ul>${rs.map(line).join('')}</ul>`);
  }
  return out.join('');
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  return esc(s)
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" loading="lazy">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([А-ЯA-Z]{1,2}\d{1,3})\*\*/g, '<span class="code">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/⚠️[^·|]*/g, m => '<span class="warn">' + m + '</span>');
}
const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
function render(md) {
  const L = md.split('\n'), out = [];
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (!l.trim()) continue;
    let m;
    if ((m = l.match(/^(#{1,3}) (.*)/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if (/^---+$/.test(l.trim())) { out.push('<hr>'); continue; }
    if ((m = l.match(/^\{\{zapisi:([a-z_]+)(?::(.+))?\}\}$/))) { out.push(Z.filter(r => r.file === m[1] && (!m[2] || r.gruppa === m[2])).map(zapis).join('')); continue; }
    if (l.trim() === '{{problemy}}') { const ST = { novaya: ['новая', 3], chinim: ['чиним', 4], gotovo: ['готово к стройке', 4], vyshlo: ['вышло', 6], pravilo: ['стало правилом', 6] };
      out.push(`<div class="card">` + Object.entries(ST).map(([k, [n]]) => `<div class="r"><b>${n}</b><span>${PR.filter(p => p.status === k).length}</span></div>`).join('') + '</div>' +
        [...PR].reverse().map(p => `<div class="card"><div class="t"><span class="code">${p.id}</span>«${esc(p.slova)}»</div><div class="step s${ST[p.status][1]}">${ST[p.status][0]}${p.versiya ? ' в ' + p.versiya : ''} · ${p.kogda}</div>${row('Что с этим', p.chto)}</div>`).join('')); continue; }
    if (l.trim() === '{{ochered}}') { out.push(ochered()); continue; }
    if (l.trim() === '{{kartochki}}') { out.push(Z.filter(r => r.kartochka).map(r => `<div class="card"><div class="t"><span class="code">${r.id}</span>${esc(r.kartochka.imya)} <em>${esc(r.latin)}</em></div>` +
      `<div class="step s${SHAG[r.shag][0]}">${r.shag === 'v_igre' ? 'в игре' : 'спит на кольце'}</div>` + row('Что даёт', r.kartochka.daet) + row('В природе', r.kartochka.priroda) + '</div>').join('')); continue; }
    if (l.trim() === '{{sushchestva}}') { out.push(Z.flatMap(r => Object.values(r.sushchestva || {}).map(c => `<div class="card"><div class="t"><span class="code">${r.id}</span>${esc(c.imya)}</div>` + row('Кто это', c.kto) + row('Совет', c.sovet) + row('В природе', c.priroda) + row('Если убил', c.ubil) + '</div>')).join('')); continue; }
    if (l.startsWith('|')) { // таблица → карточки: первая ячейка — заголовок, остальные — «шапка: значение»
      const head = cells(l); i += 2;
      while (i < L.length && L[i].startsWith('|')) {
        const c = cells(L[i++]);
        out.push('<div class="card"><div class="t">' + inline(c[0]) + '</div>' +
          c.slice(1).map((v, k) => v && v !== '—' ? `<div class="r"><b>${esc(head[k + 1] || '')}</b><span>${inline(v)}</span></div>` : '').join('') + '</div>');
      }
      i--; continue;
    }
    if ((m = l.match(/^(\s*)(-|\d+\.) /))) {
      const tag = m[2] === '-' ? 'ul' : 'ol', items = [];
      while (i < L.length && /^(-|\d+\.) /.test(L[i])) items.push('<li>' + inline(L[i++].replace(/^(-|\d+\.) /, '')) + '</li>');
      i--; out.push(`<${tag}>${items.join('')}</${tag}>`); continue;
    }
    out.push('<p>' + inline(l) + '</p>');
  }
  return out.join('\n');
}
async function show() {
  const id = (location.hash.slice(1) || 'oblozhka');
  const page = PAGES.find(p => p[0] === id) ? id : 'oblozhka';
  document.getElementById('nav').innerHTML = PAGES.map(([k, n]) => `<a href="#${k}" class="${k === page ? 'on' : ''}">${n}</a>`).join('');
  document.querySelector('nav a.on').scrollIntoView({ inline: 'center', block: 'nearest' });
  await zapisi();
  if (location.search === '?vse') { // вся книга одной лентой — из неё собирается PDF (pdf.mjs)
    const all = await Promise.all(PAGES.map(async ([k]) => render(await (await fetch(k + '.md', { cache: 'no-cache' })).text())));
    document.getElementById('nav').remove(); document.getElementById('page').innerHTML = all.join('<hr class="pb">');
    document.querySelectorAll('details').forEach(d => d.open = true); document.body.dataset.ready = '1'; return;
  }
  const r = await fetch(page + '.md', { cache: 'no-cache' });
  document.getElementById('page').innerHTML = r.ok ? render(await r.text()) : '<p>Страница не открылась.</p>';
  scrollTo(0, 0);
}
document.addEventListener('click', e => { // касание номера пункта копирует «Книга Г7: » для чата
  const c = e.target.closest('.code'); if (!c) return;
  const text = 'Книга ' + c.textContent + ': ';
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).catch(() => {});
  const t = document.getElementById('toast'); t.textContent = 'Скопировано: ' + c.textContent; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1400);
});
addEventListener('hashchange', show); show();
</script>
