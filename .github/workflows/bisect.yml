# Временная проверка: какая голова падает в WebKit. Удалить после поиска.
name: bisect
on:
  push:
    branches: [claude/project-thread-8epzcj-bisect]
jobs:
  b:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ref: [fc0a393, 31ccb19, 828b4ea, 7a0cd1f, 2ef2033, 1c8b091, 5ebb016, 503548d]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tools/install_godot.sh
      - run: |
          cp -r tools/web /tmp/web
          git checkout -q ${{ matrix.ref }}
          mkdir -p tools/web && cp /tmp/web/* tools/web/
          bash tools/web/build.sh out/site
          (cd out/site && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          for i in 1 2 3; do bash tools/web/check_site.sh http://localhost:8000 "$(git rev-parse --short HEAD)" && echo "ПРОГОН $i ОК" || echo "ПРОГОН $i ПАДЕНИЕ"; done
