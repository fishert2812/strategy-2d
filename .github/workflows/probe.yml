# Пробный файл: проверяет, что Actions включены и Godot ставится в CI. Удаляется в том же PR.
name: probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot из .godot-version
        run: |
          V=$(cat .godot-version)
          curl -sSfL -o g.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q g.zip
          ./Godot_v${V}-stable_linux.x86_64 --headless --version
          curl -sSfIL -o /dev/null -w "templates %{http_code}\n" "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
